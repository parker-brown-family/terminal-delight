<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Say along · Terminal Delight shorts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Public+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground:#17130E; --surface:#1F1A13; --surface-2:#262019; --line:#372B1D;
    --ink:#F0E7D8; --ink-dim:#A2957F; --ink-faint:#6F6553;
    --amber:#E8A33D; --amber-soft:#7A5622; --phosphor:#7BD88F; --alert:#E4655B;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--ground); color:var(--ink);
    font:400 15px/1.55 "Public Sans", system-ui, sans-serif;
  }
  header {
    border-bottom:1px solid var(--line); padding:20px 24px;
    display:flex; align-items:baseline; gap:16px; flex-wrap:wrap;
  }
  h1 { font:700 22px/1 "Archivo", sans-serif; margin:0; letter-spacing:-.01em; }
  .sub { color:var(--ink-faint); font:500 11px/1 "JetBrains Mono", monospace; letter-spacing:.12em; text-transform:uppercase; }
  main { display:grid; grid-template-columns: 300px minmax(0,1fr); gap:0; min-height:calc(100vh - 62px); }
  aside { border-right:1px solid var(--line); padding:16px; background:var(--surface); }
  aside h2, .stage h2 {
    font:500 10px/1 "JetBrains Mono", monospace; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-faint); margin:0 0 10px;
  }
  .shot {
    display:block; width:100%; text-align:left; cursor:pointer;
    background:var(--surface-2); border:1px solid var(--line); border-radius:3px;
    padding:10px 12px; margin-bottom:6px; color:var(--ink);
    font:500 13px/1.3 "JetBrains Mono", monospace;
  }
  .shot:hover { border-color:var(--amber-soft); }
  .shot[aria-current="true"] { border-color:var(--amber); background:var(--surface); }
  .shot small { display:block; margin-top:5px; color:var(--ink-faint); font:400 11px/1.4 "JetBrains Mono", monospace; }
  .shot .flags { color:var(--phosphor); }
  .stage { padding:20px 24px; display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:22px; align-items:start; }
  video { width:100%; background:#000; border:1px solid var(--line); border-radius:3px; display:block; }
  .cards { border:1px solid var(--line); border-radius:3px; background:var(--surface); padding:14px; max-height:70vh; overflow:auto; }
  .card { padding:8px 10px; border-radius:2px; color:var(--ink-dim); font-size:15px; }
  .card.now { background:var(--surface-2); color:var(--ink); border-left:2px solid var(--amber); }
  .none { color:var(--ink-faint); font-style:italic; }
  .bar { grid-column:1 / -1; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
         border-top:1px solid var(--line); padding-top:16px; margin-top:4px; }
  button.big {
    font:500 12px/1 "JetBrains Mono", monospace; letter-spacing:.1em; text-transform:uppercase;
    background:var(--amber); color:var(--ground); border:1px solid var(--amber);
    border-radius:3px; padding:11px 18px; cursor:pointer;
  }
  button.big.on { background:var(--alert); border-color:var(--alert); color:#fff; }
  button.ghost {
    font:500 11px/1 "JetBrains Mono", monospace; letter-spacing:.08em; text-transform:uppercase;
    background:var(--surface-2); color:var(--ink-dim); border:1px solid var(--line);
    border-radius:3px; padding:10px 14px; cursor:pointer;
  }
  button.ghost:hover { color:var(--ink); border-color:var(--amber-soft); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .meter { display:flex; gap:3px; align-items:center; }
  .meter i { width:6px; height:16px; background:var(--surface-2); border-radius:1px; display:block; }
  .meter i.lit { background:var(--phosphor); }
  .meter i.hot { background:var(--alert); }
  .status { font:500 12px/1.4 "JetBrains Mono", monospace; color:var(--ink-dim); flex:1; min-width:240px; }
  .status.good { color:var(--phosphor); }
  .status.bad { color:var(--alert); }
  .count { font:700 64px/1 "Archivo", sans-serif; color:var(--amber); }
  @media (max-width: 900px) { main, .stage { grid-template-columns:1fr; } aside { border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>Say along</h1>
  <span class="sub">terminal delight · shorts</span>
  <span class="sub" id="hint">pick a shot, hit record, talk over it</span>
</header>

<main>
  <aside>
    <h2>Filmed shots</h2>
    <div id="list"></div>
  </aside>

  <section class="stage">
    <div>
      <h2 id="nowplaying">No shot selected</h2>
      <video id="vid" playsinline controls preload="metadata"></video>
    </div>
    <div>
      <h2>What to say</h2>
      <div class="cards" id="cards"><p class="none">Pick a shot.</p></div>
    </div>

    <div class="bar">
      <button class="big" id="rec" disabled>● record</button>
      <button class="ghost" id="mix" disabled>mix → to-upload</button>
      <button class="ghost" id="hear" disabled>hear the mix</button>
      <div class="meter" id="meter" hidden></div>
      <span class="count" id="count"></span>
      <span class="status" id="status">Loading shots…</span>
    </div>
  </section>
</main>

<script>
/**
 * The one thing that has to be right is alignment, and the rule comes from the
 * say-along spec: never assume the recorder and the video start together. Arm the
 * recorder, wait for its own `start` event, and only then play. The gap between
 * those two moments — measured against the video's own clock, not a timer — is
 * what gets trimmed off the head of the take. The page can measure it because the
 * page owns both clocks; a terminal prompter cannot, which is why three takes
 * drifted before this existed.
 */
const $ = (id) => document.getElementById(id);
const el = { list:$("list"), vid:$("vid"), cards:$("cards"), rec:$("rec"), mix:$("mix"),
             hear:$("hear"), meter:$("meter"), count:$("count"), status:$("status"),
             now:$("nowplaying") };
for (let i = 0; i < 12; i++) el.meter.appendChild(document.createElement("i"));

let shots = [], current = null, stream = null, recorder = null, chunks = [], meterStop = null;
let state = "idle";                     // idle | counting | rolling | saving

const say = (msg, cls="") => { el.status.textContent = msg; el.status.className = "status " + cls; };

async function load() {
  const r = await fetch("/api/shots").then((x) => x.json());
  shots = r.shots || [];
  el.list.innerHTML = "";
  if (!shots.length) { el.list.innerHTML = '<p class="none">No clips yet. Film one with scripts/stage-clip.sh.</p>'; return; }
  for (const s of shots) {
    const b = document.createElement("button");
    b.className = "shot";
    b.setAttribute("aria-current", "false");
    b.innerHTML = s.slug + "<small>" + s.seconds.toFixed(1) + "s · " +
      (s.hasScript ? s.cards.length + " cards" : '<span style="color:var(--alert)">no script</span>') +
      (s.hasVoice ? ' · <span class="flags">voiced</span>' : "") +
      (s.staged ? ' · <span class="flags">staged</span>' : "") + "</small>";
    b.addEventListener("click", () => pick(s.slug));
    el.list.appendChild(b);
  }
  say(shots.length + " shot" + (shots.length === 1 ? "" : "s") + " filmed. Pick one.");
  if (!current) pick(shots[0].slug);
}

function pick(slug) {
  current = shots.find((s) => s.slug === slug);
  [...el.list.children].forEach((b, i) => b.setAttribute("aria-current", String(shots[i].slug === slug)));
  el.now.textContent = slug + " · " + current.width + "×" + current.height;
  el.vid.src = "/api/clip?slug=" + encodeURIComponent(slug);
  el.cards.innerHTML = current.cards.length
    ? current.cards.map((c, i) => '<div class="card" data-i="' + i + '">' + c + "</div>").join("")
    : '<p class="none">No script yet. Write docs/media/scripts/' + slug + '.md — one line per thing you say.</p>';
  el.rec.disabled = !current.cards.length;
  el.mix.disabled = !current.hasVoice;
  el.hear.disabled = !current.staged;
  say(current.cards.length ? "Ready. Headphones on — the take is the only audio track."
                           : "Write the script first; there is nothing to say yet.");
}

/** A level meter, because the failure that ruins a take silently is a dead mic. */
function meter(s) {
  const ctx = new AudioContext();
  const an = ctx.createAnalyser();
  an.fftSize = 512;
  ctx.createMediaStreamSource(s).connect(an);
  const buf = new Uint8Array(an.frequencyBinCount);
  let raf;
  const tick = () => {
    an.getByteTimeDomainData(buf);
    let peak = 0;
    for (const v of buf) peak = Math.max(peak, Math.abs(v - 128) / 128);
    const lit = Math.round(peak * 12);
    [...el.meter.children].forEach((i, n) => {
      i.className = n < lit ? (n > 9 ? "hot" : "lit") : "";
    });
    raf = requestAnimationFrame(tick);
  };
  tick();
  return () => { cancelAnimationFrame(raf); ctx.close(); };
}

async function mic() {
  if (stream) return stream;
  stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false },
  });
  return stream;
}

const pickType = () =>
  ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].find((t) => MediaRecorder.isTypeSupported(t)) || "";

/** Walk the card list on the video's clock, so the prompter cannot drift. */
function prompter() {
  const cards = [...el.cards.querySelectorAll(".card")];
  if (!cards.length) return () => {};
  const each = el.vid.duration / cards.length;
  const on = () => {
    const i = Math.min(cards.length - 1, Math.floor(el.vid.currentTime / each));
    cards.forEach((c, n) => c.classList.toggle("now", n === i));
  };
  el.vid.addEventListener("timeupdate", on);
  return () => el.vid.removeEventListener("timeupdate", on);
}

el.rec.addEventListener("click", async () => {
  if (state === "rolling") return stop();
  if (!current) return;

  try { await mic(); }
  catch (e) { return say("no microphone: " + e.message, "bad"); }
  el.meter.hidden = false;
  meterStop = meter(stream);

  chunks = [];
  recorder = new MediaRecorder(stream, { mimeType: pickType() });
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };

  // 1. recorder first, and wait for it to actually arm.
  await new Promise((res) => { recorder.onstart = res; recorder.start(); });
  const tRec = performance.now();

  state = "counting";
  el.rec.classList.add("on");
  el.rec.textContent = "■ stop";
  for (let n = 3; n > 0; n--) {
    el.count.textContent = String(n);
    say("counting in…");
    await new Promise((r) => setTimeout(r, 900));
    if (state !== "counting") return;
  }
  el.count.textContent = "";

  // 2. then the picture, and measure where frame zero actually landed.
  let offsetMs = null;
  const mark = () => {
    if (offsetMs !== null || el.vid.currentTime <= 0) return;
    offsetMs = (performance.now() - tRec) - el.vid.currentTime * 1000;
    el.vid.removeEventListener("timeupdate", mark);
  };
  el.vid.addEventListener("timeupdate", mark);
  const stopPrompt = prompter();
  el.vid.currentTime = 0;
  await el.vid.play();
  state = "rolling";
  say("● rolling — say it over the picture", "good");

  el.vid.onended = async () => {
    stopPrompt();
    await finish(offsetMs ?? 0);
  };
});

function stop() { el.vid.pause(); el.vid.onended?.(); }

async function finish(offsetMs) {
  if (state !== "rolling") return;
  state = "saving";
  say("saving…");
  await new Promise((res) => { recorder.onstop = res; recorder.stop(); });
  meterStop?.(); meterStop = null;
  el.meter.hidden = true;
  el.rec.classList.remove("on");
  el.rec.textContent = "● record";

  const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
  chunks = [];
  if (!blob.size) { state = "idle"; return say("nothing was recorded — the microphone produced no audio", "bad"); }

  try {
    const res = await fetch("/api/voice?slug=" + encodeURIComponent(current.slug) +
                            "&offsetMs=" + Math.round(offsetMs), {
      method: "POST", headers: { "content-type": blob.type }, body: blob,
    });
    const b = await res.json();
    if (!res.ok) throw new Error(b.error || res.statusText);
    say("✓ " + b.file + " · " + b.seconds.toFixed(1) + "s · trimmed " + b.trimmed.toFixed(2) + "s of count-in", "good");
    el.mix.disabled = false;
    current.hasVoice = true;
  } catch (e) {
    say("✗ NOT saved — " + e.message, "bad");
  }
  state = "idle";
}

el.mix.addEventListener("click", async () => {
  if (!current) return;
  el.mix.disabled = true;
  say("mixing — voice over picture, padded to 1080×1920…");
  try {
    const res = await fetch("/api/mix?slug=" + encodeURIComponent(current.slug), { method: "POST" });
    const b = await res.json();
    if (!res.ok) throw new Error(b.error || res.statusText);
    say("✓ " + b.file + " · " + b.seconds.toFixed(1) + "s — ready to post", "good");
    current.staged = true;
    el.hear.disabled = false;
  } catch (e) { say("✗ mix failed — " + e.message, "bad"); }
  el.mix.disabled = false;
});

el.hear.addEventListener("click", () => {
  if (!current) return;
  el.vid.src = "/api/clip?slug=" + encodeURIComponent(current.slug) + "&mixed=1";
  el.vid.play().catch(() => {});
  say("playing the mixed short. Hit a shot in the list to go back to the master.");
});

load();
</script>
</body>
</html>
