name: CI

on:
  pull_request:
  push:
    branches: [main, "dev/**"]
    tags: ['v*']

# A new push to a pull request cancels that pull request's older run, which
# was checking a commit nobody will merge. Pushes to main and tags each get a
# group of their own, so they are never cancelled: every main commit keeps its
# cache save, and a tag always reaches the publish job.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Rust every job builds with, pinned, so a new stable release cannot turn
# its new lints into a failure on lines a pull request never touched. That
# happened on 2026-10-07: stable moved 1.98 -> 1.99 and every PR failed clippy
# on two old lines in surface.rs (#911). 1.98.0 is what the machine the agents
# build on has as its default, so a local `cargo clippy` is CI's clippy.
# Moving it is a deliberate commit that fixes the new lints in the same change;
# toolchain-drift-watch.yml runs the latest stable weekly and says what it
# would break before anyone has to move.
env:
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      # poppler-utils is not a build dependency: the PDF test in
      # docview/poppler.rs drives the real pdfinfo and pdftoppm, and fails
      # under CI rather than skipping when they are missing.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfontconfig1-dev \
            libsqlite3-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config \
            poppler-utils \
            libcap-dev meson ninja-build

      # The distro helper lacks descriptor mounts. Use a fixed upstream release
      # with safe setup-path resolution; the runtime also refuses older helpers.
      - name: Install the qualified Restricted helper
        run: |
          curl --fail --location --retry 3 -o /tmp/bubblewrap-0.12.0.tar.xz https://github.com/containers/bubblewrap/releases/download/v0.12.0/bubblewrap-0.12.0.tar.xz
          echo '9760d007363e3abba7c747489910f9f82d9fca53ba3bd3282e396fa3c97a3314  /tmp/bubblewrap-0.12.0.tar.xz' | sha256sum --check
          tar -xJf /tmp/bubblewrap-0.12.0.tar.xz -C /tmp
          meson setup /tmp/bwrap-build /tmp/bubblewrap-0.12.0 --prefix=/usr -Dman=disabled -Dtests=false -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile -C /tmp/bwrap-build
          sudo install -m 0755 /tmp/bwrap-build/bwrap /usr/bin/bwrap
          /usr/bin/bwrap --version

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Prepare patched gpui (crt-pass + focus-blur + text-crawl + tube-cap-32 + gpl-sever)
        run: ../scripts/prepare-gpui.sh

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Format
        # --all also traverses the patched external Zed path dependencies.
        # Check both TD packages without imposing formatting on that checkout.
        run: cargo fmt -p terminal-delight -p td-agent-management -- --check

      - name: Check
        run: cargo check --locked

      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings

      # The alacritty fallback core is the way back if rio-vt misbehaves, and
      # the oracle the suite is checked against. A fallback nobody builds is
      # one that no longer compiles on the day it is needed (issue 826 removes
      # it, and these steps with it).
      - name: Clippy, fallback core
        run: cargo clippy --workspace --locked --features core-alacritty -- -D warnings

      # The HTML engine's tests drive a real Chromium, and the runner's AppArmor
      # forbids the unprivileged user namespaces its sandbox needs, so without
      # this the browser dies at launch and those tests skip. TD never runs a
      # browser without its sandbox; this lets the sandbox start (#737).
      - name: Let Chromium start its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The first Chromium launch on a fresh runner pays one-time costs (the
      # font cache, and whatever else a cold start sets up) that once took
      # longer than the engine's 30 s start limit, failing the first real-browser
      # test (run 36112126088). Paying them here keeps that out of the tests; a
      # launch that fails here is left for the tests to report.
      - name: Warm Chromium once
        run: timeout 180 chromium --headless=new --no-first-run --disable-gpu --dump-dom about:blank >/dev/null 2>&1 || true

      - name: Test
        run: cargo test --workspace --locked

      - name: Test, fallback core
        run: cargo test --workspace --locked --features core-alacritty

      - name: Prove the Restricted OS boundary
        run: |
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "/run/user/$(id -u)"
          cargo test --locked --test restricted -- --ignored --test-threads=1

      - name: Release build smoke
        run: cargo build --release --locked

  js:
    name: Browser prototype checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check ES modules
        run: |
          node --check src/js/main.js
          node --check src/js/workspace.js
          node --check src/js/panes.js
          node --check src/js/popout.js
          node --check src/js/detach.js
          node --check src/js/theme-engine.js
          node --check assets/kiosk-theme.js
          node --check assets/kiosk-chrome.js
          node --check assets/robots/tool-faces.js
      # The website serves a copy of the app's tool faces. A copy with nothing
      # watching it is how the wall's own screenshot sat two generations stale,
      # so this fails the build rather than letting the two walls drift apart.
      - name: Robot faces match the app
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          node scripts/publish-robot-faces.mjs --check

  supply-chain:
    name: Supply-chain checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Prepare patched gpui (crt-pass + focus-blur + text-crawl + tube-cap-32 + gpl-sever)
        run: ../scripts/prepare-gpui.sh
      - uses: taiki-e/install-action@cargo-audit
      - uses: taiki-e/install-action@cargo-deny
      - name: Audit advisories
        # quick-xml transitive DoS (RUSTSEC-2026-0194/0195) is pinned in the vendored
        # gpui graph and unreachable to untrusted XML — see app/deny.toml. Revisit
        # when upstream moves to quick-xml >=0.41.
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
      - name: Check licenses and sources
        run: cargo deny check

  # The release policy, proven on every pull request without a tag: what a
  # candidate and a stable tag publish, and which tags publish nothing. The
  # publish job runs the same script, so a change to the policy that this
  # does not accept cannot reach a release.
  # On-screen English a pull request adds is drawn in English in all nine
  # languages until it is in the language pack. This names it, on the changed
  # lines and in the run summary, and never fails: a suggestion, not a gate
  # (Parker, 2026-10-20). docs/TRANSLATING.md is the how. A pull request is
  # checked out as its merge commit, so a branch that merged an older main is
  # judged on what it changes now.
  translations:
    name: Translation suggestions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Suggest translations for new on-screen English
        run: python3 scripts/translation-suggest.py "${{ github.event.pull_request.base.sha }}" HEAD
      - name: Prove the suggester against history
        run: bash scripts/test-translation-suggest.sh

  release-policy:
    name: Release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint the release scripts
        run: shellcheck scripts/release-meta.sh scripts/test-release-meta.sh
      - name: Prove the release policy against fixtures
        run: bash scripts/test-release-meta.sh

  package:
    name: AppImage (artifact)
    # Build the distributable MIT-clean AppImage on pushes to main and on version
    # tags, as a run artifact with its digest. Building is all this job does:
    # attaching it to a release is the publish job's, which waits for every
    # check. Until 2026-10-19 this job published the release itself, beside the
    # tests rather than after them, so a tag could ship before anyone knew
    # whether its commit passed (#1002).
    if: github.event_name == 'push'
    # Pin to the OLDEST glibc we want to support: ubuntu-22.04 ships glibc 2.35, so
    # the AppImage runs on glibc >= 2.35 (Ubuntu 22.04+, Debian 12+, etc.). Building
    # on ubuntu-latest (24.04 / glibc 2.39) would make the binary refuse to start on
    # any older system — glibc is the one lib an AppImage can't bundle.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Prepare patched gpui (crt-pass + focus-blur + text-crawl + tube-cap-32 + gpl-sever)
        run: ./scripts/prepare-gpui.sh

      # No rust-cache here on purpose: this job runs on ubuntu-22.04 while the rust
      # checks run on ubuntu-latest, and Swatinem/rust-cache doesn't key on the
      # runner version — restoring 24.04-built rlibs here breaks the build
      # ("can't find crate for ashpd"). A clean build keeps the release artifact
      # correct and reproducible.
      # cargo-about is installed on demand by build-appimage.sh (no install-action
      # tag exists for it), so no separate setup step is needed here.
      - name: Build AppImage
        run: ./scripts/build-appimage.sh

      # The digest a person checks the downloaded file against, and the one the
      # release candidate's validation is recorded against (RELEASING.md).
      - name: Record the AppImage digest
        run: |
          cd dist
          sha256sum terminal-delight-x86_64.AppImage > terminal-delight-x86_64.AppImage.sha256
          cat terminal-delight-x86_64.AppImage.sha256

      - name: Upload AppImage (run artifact)
        uses: actions/upload-artifact@v4
        with:
          name: terminal-delight-x86_64.AppImage
          path: |
            dist/terminal-delight-x86_64.AppImage
            dist/terminal-delight-x86_64.AppImage.sha256
          if-no-files-found: error

  publish:
    name: Publish release (tags only)
    # After every check, on the tagged commit, or not at all. A failed or
    # skipped job above means `needs` is unmet and nothing is published.
    needs: [rust, js, supply-chain, release-policy, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and attach the AppImage
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A release is a snapshot of main, or of a release/* branch cut from it
      # while a candidate takes fixes. A tag on any other commit publishes
      # nothing, however green it is.
      - name: The tagged commit is on main or a release branch
        run: |
          git fetch --quiet origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/release/*:refs/remotes/origin/release/*'
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin/main 'refs/remotes/origin/release/*'); do
            if git merge-base --is-ancestor "$GITHUB_SHA" "$ref"; then
              echo "$GITHUB_SHA is on $ref"
              exit 0
            fi
          done
          echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is on neither main nor a release/* branch"
          exit 1

      - name: Classify the tag and assemble its notes
        id: meta
        run: bash scripts/release-meta.sh "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: terminal-delight-x86_64.AppImage
          path: dist

      - name: Verify the digest and record it in the notes
        run: |
          cd dist
          sha256sum --check terminal-delight-x86_64.AppImage.sha256
          # The backticks are Markdown for the release page, not shell.
          # shellcheck disable=SC2016
          {
            printf '\n## Verify the download\n\n'
            printf 'Built by CI from commit `%s`.\n\n```\n' "$GITHUB_SHA"
            cat terminal-delight-x86_64.AppImage.sha256
            printf '```\n\nCheck it with `sha256sum --check terminal-delight-x86_64.AppImage.sha256`.\n'
          } >> release-body.md

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          name: Terminal Delight ${{ steps.meta.outputs.version }}
          body_path: ${{ steps.meta.outputs.body_path }}
          draft: ${{ steps.meta.outputs.draft }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          files: |
            dist/terminal-delight-x86_64.AppImage
            dist/terminal-delight-x86_64.AppImage.sha256
          fail_on_unmatched_files: true
