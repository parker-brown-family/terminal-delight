name: Terminal Lab

# The correctness lane of the Terminal Lab (docs/plans/terminal-lab/plan.md):
# thousands of generated byte streams replayed through both terminal cores,
# whole and cut at seeded places, every disagreement shrunk to a reproducer.
# It runs on GitHub's free minutes for public repositories, inside the budget
# Parker approved: four jobs at most, fifteen minutes each including setup,
# failure artifacts capped at 10 MB per shard and kept seven days.
#
# Manual first. The weekly schedule below stays commented out until a real
# manual run has finished inside the budget with both planted-fault controls
# caught; that run is linked from docs/plans/terminal-lab/00-status.md.

on:
  workflow_dispatch:
    inputs:
      cases:
        description: Generated cases across all shards
        default: "6000"
      seed_base:
        description: First seed (a seed names one case within a corpus version)
        default: "0"
  # schedule:
  #   - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: td-lab-${{ github.ref }}
  cancel-in-progress: false

env:
  # Must equal ci.yml's: it is part of the cache key the build job restores.
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  # The job id is `rust` on purpose. Swatinem/rust-cache keys on the job id,
  # the toolchain and the lockfile, so this restores the dependency cache that
  # ci.yml's `rust` job saves on every push to main, which holds both cores'
  # test dependencies. Renamed, it builds gpui cold and misses the budget.
  rust:
    name: Build both cores' test binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Prepare patched gpui (crt-pass + focus-blur + text-crawl + tube-cap-32 + gpl-sever)
        run: ../scripts/prepare-gpui.sh

      - name: Restore CI's cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          save-if: false

      - name: Build the two test binaries
        run: |
          mkdir -p ../lab-bin
          for core in rio alacritty; do
            features=""
            [ "$core" = alacritty ] && features="--features core-alacritty"
            # shellcheck disable=SC2086
            path=$(cargo test --locked --bin terminal-delight --no-run --message-format=json $features \
              | jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable != null) | .executable' \
              | tail -1)
            test -x "$path"
            cp "$path" "../lab-bin/$core"
            strip "../lab-bin/$core"
          done
          ls -la ../lab-bin

      - uses: actions/upload-artifact@v4
        with:
          name: lab-bin
          path: lab-bin
          retention-days: 1
          if-no-files-found: error

  shard:
    name: Shard ${{ matrix.shard }}/3
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]
    env:
      TD_LAB_BIN_RIO: ${{ github.workspace }}/lab-bin/rio
      TD_LAB_BIN_ALACRITTY: ${{ github.workspace }}/lab-bin/alacritty
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/lab
            app/src/vt/lab

      # No packages to install: the test binary links only libc and libstdc++
      # (gpui opens its display libraries at run time, and the lab never draws).

      - uses: actions/download-artifact@v4
        with:
          name: lab-bin
          path: lab-bin

      - run: chmod +x lab-bin/*

      # Shard 1 also proves the lab can see: two planted faults must be
      # detected, shrunk and replayed, or the run fails whatever else it finds.
      - name: Planted-fault controls
        if: matrix.shard == 1
        run: python3 scripts/lab/run.py control --out lab-out/controls

      - name: Replay and compare
        run: |
          python3 scripts/lab/run.py run --out lab-out/run \
            --shard ${{ matrix.shard }}/3 \
            --cases "${{ inputs.cases || '6000' }}" \
            --seed-base "${{ inputs.seed_base || '0' }}" \
            --minimize-budget 420

      # Summaries always; reproducers only exist when something failed. The
      # run itself caps reproducers at 10 MB.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-shard-${{ matrix.shard }}
          path: lab-out
          retention-days: 7
          if-no-files-found: warn
