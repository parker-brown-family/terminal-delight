# terminal-delight theme — tactical-overdrive (high-contrast cyan command deck)
# Palette trued-up to IMT campaign-manager: tactical base 5/11/14% lightness,
# companion-hue borders (5baecd band), warm #ff9b45 signals.
name = "tactical-overdrive"
icon = "★"
# The deck's own skin. Picking Tactical brings OPS; picking OPS under any
# other design still works, because an explicit skin choice outranks this.
skin = "ops"

# THE LOOK a window starts from the first time it wears this design (see
# app/src/looks.rs). Only what differs from the house look; everything else,
# and every change you make while wearing it, is the window's to remember.
[look]
crt = true

[colors]
bg      = "#061015"
surface = "#101f26"
text    = "#eefaff"
accent  = "#31d7ff"
faint   = "#1b3947"
cursor  = "#7df2ff"
ansi = [
  "#0a1018", "#ff5050", "#39d98a", "#ff9b45",
  "#31d7ff", "#b78aff", "#67e8f9", "#dff6ff",
  "#1d4663", "#ff8484", "#6ee7b7", "#ffb36f",
  "#91f6ff", "#d0b3ff", "#a5f3fc", "#f2fbff",
]

# TEXTURE: a command deck, lit but not glaring. Until 2026-10-19 this was the
# brightest finish in the set (glow 0.78, bloom 0.55, bezel 0.98). The workshop's
# overlay comparison argued for less: texture under the text, glow on the lit
# thing and the numbers. The loud version is the Intrusive design, chosen on
# purpose rather than worn by default.
[effects]
scanline_opacity = 0.022
scanline_step    = 3.0
vignette         = 0.24
glow             = 0.35
bloom            = 0.25
tracking         = 0.06
tracking_period  = 26.0
tracking_sweep   = 5.0
flicker          = 0.03
jiggle           = 0.0
bezel            = 0.45    # a raised frame, not a chrome trim

[font]
family      = "JetBrains Mono"
size        = 14.0
cell_height = 20.0
