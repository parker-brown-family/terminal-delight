# Chalk Flower light: plum ink, gesso grid and a warm pigment frame.
# The paper skin supplies UI handwriting; this font stays monospace.
name = "chalk-flower"
icon = "✿"
skin = "paper"

[colors]
bg = "#fcfaf6"
surface = "#e5ddd4"
text = "#180a15"
accent = "#a53c6a"
faint = "#866e7c"
cursor = "#a53c6a"
human = "#286b72"
ansi = [
 "#180a15", "#a13e46", "#3a6e46", "#89611d",
 "#3c648e", "#95436f", "#286b72", "#6e4a58",
 "#766570", "#af3b29", "#326b3e", "#866015",
 "#356797", "#984478", "#276c73", "#180a15",
]

[effects]
scanline_opacity = 0.0
vignette = 0.0
glow = 0.0
bloom = 0.0
tracking = 0.0
flicker = 0.0
jiggle = 0.0
screen_glare = 0.0
bezel = 0.0

[font]
family = "JetBrains Mono"
size = 14.0
cell_height = 21.0
