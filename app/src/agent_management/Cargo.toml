[package]
name = "td-agent-management"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
path = "mod.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
rusqlite = "0.37"
sha2 = "0.10.9"
uuid = { version = "1.23.3", features = ["v7", "serde"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
libc = "0.2.186"

[dev-dependencies]
tempfile = "3"
