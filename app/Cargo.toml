[package]
name = "terminal-delight"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Tabful tiling Linux terminal manager — native-snappy, web-app polished, themeable at will"
repository = "https://github.com/parker-brown-family/terminal-delight"
readme = "../README.md"
publish = false

[package.metadata.terminal-delight]
# gpui consumed from a pinned Zed checkout (post-wgpu Linux renderer) carrying
# the td-crt-pass patch (docs/patches/0001-td-crt-pass.patch) — the per-pane
# CRT barrel warp. To build: clone zed at zed_rev as a sibling `zed-upstream/`
# of the repo root and `git apply` the patch (scripts/prepare-gpui.sh does both).
zed_rev = "abbe85a3321bf6cb7f5b241e623d9c2e16c29187"

[features]
# The terminal emulator core is rio-vt. `core-alacritty` builds on
# alacritty_terminal 0.26 instead, behind the same boundary (src/vt/): kept as
# the way back if rio-vt misbehaves in daily use, and as the oracle the test
# suite checks rio-vt against, until a follow-up removes it. See
# docs/plans/core-swap-rio/.
default = []
core-alacritty = ["dep:alacritty_terminal"]

[dependencies]
alacritty_terminal = { version = "0.26", optional = true }
# The terminal emulator core, reached only through src/vt/. Without its
# defaults, which bring Rio's own pseudoterminal and event loop (TD has its
# own); with `graphics`, which is what decodes a PNG a program sends — without
# it rio-vt fails a PNG picture silently and tells the program it succeeded.
rio-vt = { version = "=0.5.28", default-features = false, features = ["graphics"] }
# The flags and modes in src/vt/types.rs, in the bitflags generation both
# cores use.
bitflags = "2"
# CommonMark + GFM for Markdown drawn in the pane (docview/markdown.rs, lifted
# from markdown-delight at the same version so the copy compiles unchanged).
# Without its defaults: they bring clap, syntect and the onig C library for
# comrak's own CLI and highlighter, and the renderer uses none of them.
comrak = { version = "0.52", default-features = false }
futures = "0.3"
# What TD's read loop (src/vt/pump.rs) waits on: a terminal's descriptor, its
# child's pidfd, and the wake a keystroke sends.
polling = "3.8"
# The lock every terminal is shared under: the renderer, the read loop and the
# session host's fence. `unlock_fair` is what hands it to a waiting renderer
# after each chunk the loop parses.
parking_lot = "0.12"
# Opening a pseudoterminal and setting IUTF8 on it (src/vt/pty.rs), the crate
# alacritty's own tty module uses.
rustix-openpty = "0.2"
gpui = { path = "../../zed-upstream/crates/gpui" }
gpui_platform = { path = "../../zed-upstream/crates/gpui_platform", features = ["x11", "wayland"] }
libc = "0.2.186"

[target.'cfg(target_os = "linux")'.dependencies]
# td-crt-pass lives in this crate (see docs/patches/)
gpui_wgpu = { path = "../../zed-upstream/crates/gpui_wgpu" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
# gpui's headless test platform — `TestAppContext`, `VisualTestContext`, the
# deterministic dispatcher — so a real `TerminalView` can be built and driven
# with real mouse and key events in `cargo test` (src/pane/harness.rs). Dev
# only: cargo's feature resolver keeps `test-support` out of `cargo build`,
# `cargo check` and `cargo clippy`, so the shipped binary is unchanged.
gpui = { path = "../../zed-upstream/crates/gpui", features = ["test-support"] }

[profile.dev]
# gpui is heavy; keep our own code debuggable but deps optimized
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
