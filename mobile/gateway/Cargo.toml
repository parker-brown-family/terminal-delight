[package]
name = "td-mobile-gateway"
version = "0.1.0"
edition = "2021"
description = "The door between a phone and a Terminal Delight session host"
license = "MIT"
publish = false

# Deliberately NOT a member of app/'s workspace: the gateway must build in
# seconds, and app/ drags in gpui. It speaks the session host protocol from
# docs/protocol/session-host-v1.md as JSON over the socket, the same way any
# other client would, so it shares no code with the host and needs none.

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"

[profile.release]
strip = true
lto = "thin"
