<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>terminal-delight — the agent wall</title>
<meta name="description" content="terminal-delight as mission control for a fleet of coding agents: a read-only console of themed cards — each agent's project, what it's doing right now, live token spend, and three bars read from its own transcript (CTX WINDOW, FATIGUE, RELEVANCE) with the call they add up to. Filter by program and state; click a card to watch.">
<!-- kiosk family chrome -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta property="og:title" content="terminal-delight — the agent wall">
<meta property="og:description" content="Mission control for a fleet of coding agents. A working pane shows the robot holding the tool it is actually holding — at the console, into the cave — over three bars read from that agent's own transcript: CTX WINDOW, FATIGUE, RELEVANCE, and the call they add up to. Read-only; it never writes to a terminal.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://terminal-delight.brownfamilysports.com/agents.html">
<meta property="og:image" content="https://terminal-delight.brownfamilysports.com/assets/agents-wall.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/assets/kiosk-chrome.css">
<!-- The tool faces the app wears, published out of app/assets by
     scripts/publish-robot-faces.mjs. One table, two walls. -->
<script src="/assets/robots/tool-faces.js"></script>
<script src="/assets/kiosk-theme.js"></script>
<script src="/assets/kiosk-chrome.js" data-kiosk="agents" data-rail="on" data-paint="root" data-float="on"></script>
<style>
  /* The console's surfaces run through Omarchy roles; its STATUS colours do
     not. assets/kiosk-theme.js writes the roles onto :root, so the glass, the
     phosphor and the rules all follow whichever theme the reader picked
     elsewhere in the family — while amber/red/cyan/violet/pink stay exactly
     what they are, because on this page colour is a reading of the fleet.
     miasma's red is #685742, and an error wearing it would look calm. */
  :root{
    --bg:#04100a; --bg-deep:var(--bg0, #020806); --ink:var(--fg, #cfeede);
    --dim:var(--fg2, #5f8f76); --dim2:color-mix(in srgb, var(--fg2, #5f8f76) 62%, var(--bg0, #020806));
    --phos:var(--acc, #36ff7e); --phos-d:color-mix(in srgb, var(--acc, #36ff7e) 55%, var(--bg0, #020806));
    --amber:#ffb13c; --st-red:#ff5d52; --cyan:#46d9e8; --violet:#c084fc; --pink:#ff7eb6;
    --line:var(--mut, #103b28); --row:var(--bg2, #07140d);
    --glow:0 0 8px;
    --gi:0.62; --scan:0.5;
    --spill:color-mix(in srgb, var(--acc, #36ff7e) 16%, transparent);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(130% 90% at 50% -8%, color-mix(in srgb, var(--bg) 84%, var(--fg,#7dffa0)) 0%, var(--bg) 52%, var(--bg0, #010504) 100%), var(--bg-deep);
    color:var(--ink); min-height:100%;
    font-family:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased; letter-spacing:.01em;
    display:flex; align-items:center; justify-content:center; padding:74px 22px 30px;
  }
  body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:26%;pointer-events:none;z-index:0;
    background:linear-gradient(#0000,#08160e66 45%,#0a1c1299);
    -webkit-mask:linear-gradient(#0000,#000 70%);mask:linear-gradient(#0000,#000 70%);}

  /* ===== the console cabinet ===== */
  .console{ position:relative; width:min(98vw,1280px); z-index:1; }
  .cabinet{
    position:relative; border-radius:24px 24px 18px 18px; padding:18px 18px 14px;
    background:
      repeating-linear-gradient(90deg,#00000014 0 2px,#ffffff05 2px 4px,#00000010 4px 9px),
      linear-gradient(160deg,#22282a,#11181a 46%,#0a1012);
    box-shadow:0 2px 0 #ffffff14 inset, 0 -16px 38px #00000055 inset,
      0 46px 80px -28px #000c, 0 16px 36px #0009, 0 0 50px -8px var(--spill);
  }
  .cabinet::before{ content:""; position:absolute; inset:11px; border-radius:16px;
    box-shadow:0 0 0 2px #0007, 0 0 24px #0006 inset; pointer-events:none; }
  .screen-housing{ position:relative; border-radius:18px/16px; padding:12px;
    background:linear-gradient(150deg,#0c1110,#11181a);
    box-shadow:0 0 0 3px #0006, 0 8px 26px #000a inset, 0 2px 0 #ffffff10 inset; }
  .screen-housing::after{ content:""; position:absolute; inset:-6px; border-radius:22px/20px; pointer-events:none;
    box-shadow:0 0 46px 3px var(--spill) inset; mix-blend-mode:screen; }
  .screen{
    position:relative; border-radius:14px/13px; overflow:hidden;
    background:linear-gradient(#03130b,#020a07);
    box-shadow:0 0 0 5px #0a0b09, 0 0 70px #000a inset;
    padding:16px 18px 12px;
    height:80vh; min-height:560px; display:flex; flex-direction:column;
    filter:brightness(calc(.78 + var(--gi)*.5)) saturate(calc(.82 + var(--gi)*.4));
  }
  .screen::before{ content:""; position:absolute; inset:0; pointer-events:none; z-index:6;
    background:repeating-linear-gradient(0deg,#0000 0 2px,#00000028 2px 3px);
    mix-blend-mode:multiply; opacity:var(--scan); }
  .screen::after{ content:""; position:absolute; inset:0; pointer-events:none; z-index:7; border-radius:14px;
    box-shadow:0 0 130px 12px #000000aa inset, 0 0 46px 5px #16ff7e16 inset;
    background:radial-gradient(125% 92% at 50% 4%, color-mix(in srgb, var(--phos) 7%, transparent), #0000 52%); }
  .sheen{ position:absolute; inset:0; pointer-events:none; z-index:8; border-radius:14px;
    background:radial-gradient(150% 56% at 26% -4%, #ffffff12, #fff0 42%); mix-blend-mode:screen; }

  /* ---- header / rollup ---- */
  .top{ display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    padding-bottom:9px; border-bottom:1px solid var(--line); position:relative; z-index:4; }
  .eyebrow{ font-size:10.5px; letter-spacing:.32em; color:var(--dim); text-transform:uppercase; }
  .title{ font-size:17px; font-weight:800; letter-spacing:.16em; color:var(--phos);
    text-shadow:var(--glow) color-mix(in srgb, var(--phos) 53%, transparent); }
  .roll{ margin-left:auto; display:flex; gap:15px; align-items:baseline; font-size:12.5px; flex-wrap:wrap; }
  .pill{ display:inline-flex; gap:5px; align-items:baseline; }
  .pill b{ font-weight:800; }
  .c-work{ color:var(--phos); } .c-block{ color:var(--amber); }
  .c-err{ color:var(--st-red); } .c-done{ color:var(--phos-d); } .c-idle{ color:var(--dim); }
  .spend{ color:var(--ink); } .spend .k{ color:var(--dim); }

  .sub{ display:flex; gap:10px; align-items:center; font-size:11px; color:var(--dim);
    padding:7px 0 8px; position:relative; z-index:4; flex-wrap:wrap; }
  .sub .dot{ width:6px;height:6px;border-radius:50%;background:var(--phos);box-shadow:var(--glow) var(--phos); animation:beat 1.6s infinite; }
  @keyframes beat{ 0%,100%{opacity:.35} 50%{opacity:1} }

  /* ---- filter chips: program + state, like the in-app wall ---- */
  .chiprow{ display:flex; gap:7px; flex-wrap:wrap; align-items:center; position:relative; z-index:4; padding:3px 0; }
  .chiprow + .chiprow{ padding-top:2px; }
  .chips-wrap{ border-bottom:1px solid var(--line); padding-bottom:9px; margin-bottom:3px; }
  .chip{ display:inline-flex; gap:7px; align-items:center; cursor:pointer; user-select:none;
    font-size:11.5px; padding:4px 11px; border-radius:999px;
    border:1px solid var(--line); background:#08160e; color:var(--dim);
    transition:background .18s,border-color .18s,color .18s,box-shadow .18s; }
  .chip:hover{ color:var(--ink); border-color:#1d6a44; }
  .chip .cdot{ width:8px;height:8px;border-radius:50%; box-shadow:0 0 6px currentColor; }
  .chip .cct{ color:var(--dim2); font-size:10.5px; }
  .chip.on{ color:#eafff2; border-color:var(--cc,#36ff7e);
    background:linear-gradient(#0d2417,#0a1b11); box-shadow:0 0 0 1px var(--cc,#36ff7e) inset, 0 0 12px -2px var(--cc,#36ff7e); }
  .chip.on .cct{ color:#9fd9bb; }

  /* ---- the wall: grouped card grid ---- */
  .wall{ flex:1; overflow:auto; position:relative; z-index:3; margin:0 -4px; padding:4px 4px 2px;
    scrollbar-width:thin; scrollbar-color:#1c5a3a #0000; }
  .wall::-webkit-scrollbar{ width:8px; } .wall::-webkit-scrollbar-thumb{ background:#1c5a3a; border-radius:8px; }

  .grp{ font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--dim2);
    padding:13px 6px 7px; display:flex; align-items:center; gap:8px; }
  .grp .bar{ width:10px;height:10px;border-radius:3px; box-shadow:var(--glow); }
  .grp .gnm{ color:#9fd9bb; }
  .grp .ct{ color:var(--dim2); margin-left:auto; letter-spacing:.1em; }

  .cardgrid{ display:grid; gap:13px; grid-template-columns:repeat(auto-fill,minmax(208px,1fr)); }

  /* ---- the card: a CCG-style portrait, mirroring the in-app wall ---- */
  .card{ position:relative; border-radius:13px; padding:3px; cursor:pointer;
    border:2px solid var(--gc); background:linear-gradient(150deg, color-mix(in srgb,var(--tc) 30%, #0a140e), #0a140e 60%, color-mix(in srgb,var(--tc) 14%, #060c08));
    box-shadow:0 14px 30px -18px #000d, 0 0 0 1px #0006;
    transition:transform .18s, box-shadow .25s, border-color .25s; }
  .card:hover{ transform:translateY(-3px); border-color:color-mix(in srgb,var(--gc) 70%, #fff 0%);
    box-shadow:0 22px 40px -18px #000e, 0 0 22px -6px var(--gc); }
  .card.working{ box-shadow:0 16px 32px -18px #000d, 0 0 20px -6px var(--gc); }
  .card.blocked{ border-color:#caa23a; } .card.error{ border-color:#d05a52; }
  .card.done{ opacity:.92; } .card.idle{ opacity:.8; }
  .cardface{ position:relative; border-radius:10px; border:1px solid color-mix(in srgb,var(--gc) 30%, #0000);
    background:linear-gradient(#0b150fdd, #07100bee); padding:8px 8px 7px; display:flex; flex-direction:column; gap:6px; }

  .cardtop{ display:flex; align-items:center; gap:6px; min-width:0; }
  .crest{ flex:none; font-size:9px; color:color-mix(in srgb,var(--gc) 70%,#cfeede); }
  .cname{ flex:1; min-width:0; font-size:10px; font-weight:800; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .kbadge{ flex:none; font-size:7.5px; font-weight:800; letter-spacing:.1em; padding:2px 5px; border-radius:4px;
    color:color-mix(in srgb,var(--gc) 80%,#fff); border:1px solid color-mix(in srgb,var(--gc) 45%,#0000); background:color-mix(in srgb,var(--gc) 12%,#0000); }
  .cwd{ font-size:7.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* art window: the logo portrait behind curved glass */
  .art{ position:relative; height:116px; border-radius:9px; overflow:hidden;
    border:2px solid color-mix(in srgb,var(--gc) 22%, #000);
    background:radial-gradient(120% 100% at 50% 34%, color-mix(in srgb,var(--tc) 16%, #03100a), #02100a 75%);
    box-shadow:0 0 0 1px #0008, 0 8px 18px #000a inset; }
  /* contain + center → every logo fully visible and centred in the frame, breathing room */
  .art img{ width:100%; height:100%; object-fit:contain; object-position:center center; padding:7px;
    filter:saturate(1.05) contrast(1.02); }
  .art::after{ content:""; position:absolute; inset:0; pointer-events:none;
    background:
      repeating-linear-gradient(0deg,#0000 0 2px,#00000026 2px 3px),
      radial-gradient(120% 90% at 50% 0%, #ffffff14, #0000 46%),
      radial-gradient(130% 120% at 50% 120%, #000a, #0000 55%);
    mix-blend-mode:soft-light; }
  .art .arttone{ position:absolute; inset:0; pointer-events:none; mix-blend-mode:overlay;
    background:radial-gradient(120% 100% at 50% 30%, color-mix(in srgb,var(--tc) 40%,#0000), #0000 70%); }
  /* ---- the robot at work -------------------------------------------------
     The scene is the playhouse robot, animated: 16 frames on a 1.24s loop,
     the same WebP the app decodes. It fills the frame rather than sitting
     inside padding like a logo does, because it is a picture of a room and
     the room's floor and vignette are part of it.

     The tool's own tint lights the frame, so the card is briefly amber at the
     console and blue while reading, which is a second, peripheral read on what
     the fleet is doing — you catch the colour change before you read a word. */
  .art.robot{ background:radial-gradient(120% 100% at 50% 34%, color-mix(in srgb,var(--tint) 15%, #03100a), #010a06 74%);
    border-color:color-mix(in srgb,var(--tint) 30%, #000); }
  /* Contain, like every other logo in this frame — the art box runs from
     1.71:1 on a wide desktop to 2.22:1 on a phone against a 2.00:1 scene, so
     cover would crop the antenna at one end and the feet at the other. The
     scene's own dark room blends into the frame's gradient, so there is no
     letterbox seam to see. Less padding than a logo gets: this is a picture of
     a room, not a mark that needs breathing space. */
  .art.robot img.scene{ padding:2px 2px 10px; object-fit:contain; }
  .art.robot img.still{ display:none; }
  /* Lettered on the glass, like the app's plate: what a human calls the thing,
     not the tool's API name. */
  .art .verb{ position:absolute; left:0; right:0; bottom:0; z-index:2;
    padding:9px 8px 5px; text-align:center; pointer-events:none;
    font-size:8px; letter-spacing:.11em; text-transform:lowercase;
    color:color-mix(in srgb,var(--tint) 45%, #f2fff8);
    text-shadow:0 0 7px #000c, 0 1px 0 #000;
    background:linear-gradient(#0000, #000000b8 62%); }

  /* Six looping animations is a lot of movement for anyone who asked for less.
     An animated WebP cannot be paused from CSS, so the honest fallback is to
     swap it for the app's own still prop — the same object, not moving. */
  @media (prefers-reduced-motion: reduce) {
    .art.robot img.scene{ display:none; }
    .art.robot img.still{ display:block; padding:14px 14px 22px; object-fit:contain; }
  }

  .art.gen{ display:flex; align-items:center; justify-content:center;
    background:radial-gradient(120% 100% at 50% 25%, color-mix(in srgb,var(--tc) 34%, #0a140e), #060c08 72%); }
  .art.gen .mono{ font-size:34px; font-weight:800; letter-spacing:.04em; color:color-mix(in srgb,var(--gc) 55%, #cfeede); text-shadow:0 0 18px color-mix(in srgb,var(--gc) 60%,#0000); opacity:.92; }

  .statbar{ display:flex; gap:5px; flex-wrap:wrap; }
  .sbox{ font-size:7px; letter-spacing:.06em; padding:2px 5px; border-radius:4px; display:inline-flex; gap:4px; align-items:center;
    border:1px solid color-mix(in srgb,var(--gc) 30%,#0000); color:#9fc7b3; background:#0000; }
  .sbox b{ color:color-mix(in srgb,var(--gc) 85%,#fff); font-weight:800; }
  .sbox .lab{ color:var(--dim2); }

  /* ---- vitals: three bars and the call they add up to --------------------
     The tone classes are the whole point. White is neutral and carries no
     opinion; amber and red are only ever worn by a bar whose own threshold
     the verdict has crossed, so scanning the wall for colour and reading the
     chips give the same answer. */
  .t-ok   { --vt: var(--ink); }
  .t-warn { --vt: var(--amber); }
  .t-bad  { --vt: var(--st-red); }

  .mdl{ font-size:7px; letter-spacing:.07em; padding:2px 6px; border-radius:4px; display:inline-flex; gap:3px; align-items:center;
    border:1px solid color-mix(in srgb,var(--gc) 34%,#0000); background:color-mix(in srgb,var(--gc) 9%,#0000); color:#9fc7b3; }
  .mdl b{ color:color-mix(in srgb,var(--gc) 85%,#fff); font-weight:800; }
  .mdl i{ font-style:normal; color:var(--dim2); }

  .call{ font-size:7px; font-weight:800; letter-spacing:.09em; padding:2px 6px; border-radius:4px;
    color:var(--vt); border:1px solid color-mix(in srgb,var(--vt) 42%,#0000);
    background:color-mix(in srgb,var(--vt) 12%,#0000); cursor:help; }

  .vitals{ display:grid; gap:2px; margin:5px 0 1px; }
  .vitals.none{ font-size:7px; letter-spacing:.05em; color:var(--dim2); padding:3px 0 1px; }
  .vitals .vq{ border:1px solid var(--dim2); border-radius:50%; padding:0 3px; margin-left:2px; cursor:help; }
  .vrow{ display:grid; grid-template-columns:52px 1fr 26px; gap:5px; align-items:center; font-size:6.5px; letter-spacing:.06em; }
  .vlab{ color:var(--dim2); white-space:nowrap; }
  .vnum{ color:var(--vt); text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
  .vbar{ height:3px; border-radius:2px; background:color-mix(in srgb,var(--line) 80%,#0000); overflow:hidden; }
  /* The ramp spans the FILL, not the track — a gradient across the track puts
     the alarming end of the scale on screen even when the bar is short. */
  .vbar i{ display:block; height:100%; border-radius:2px;
    background:linear-gradient(90deg, color-mix(in srgb,var(--vt) 45%,#0000) 0%, var(--vt) 100%); }

  .recap{ font-size:9px; line-height:1.45; color:#9fc7b3; min-height:34px;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .recap .g{ color:var(--gc); margin-right:4px; }
  .recap .ger{ color:var(--dim); }
  .working .recap{ color:#bfe9d2; } .blocked .recap{ color:#ffd79a; } .error .recap{ color:#ffb0aa; }

  .cardbot{ display:flex; align-items:center; gap:8px; font-size:8px; color:var(--dim2); margin-top:1px; }
  .cardbot .d{ color:color-mix(in srgb,var(--gc) 80%,#cfeede); font-weight:700; }
  .cardbot .s{ color:var(--dim); }
  .pip{ margin-left:auto; display:inline-flex; gap:5px; align-items:center; font-size:8px; font-weight:800; letter-spacing:.05em;
    padding:2px 6px; border-radius:6px; border:1px solid; }
  .pip.working{ color:var(--phos); border-color:#1f6a40; background:#0c2417; box-shadow:0 0 10px -3px var(--phos); }
  .pip.blocked{ color:var(--amber); border-color:#5a3f12; background:#1c1404; }
  .pip.error{ color:var(--st-red); border-color:#5a1f1c; background:#1c0807; }
  .pip.done{ color:var(--phos-d); border-color:#16482e; background:#0a1b11; }
  .pip.idle{ color:var(--dim); border-color:#173a28; background:#08160e; }
  .pip.shell{ color:var(--dim); border-color:#173a28; background:#08160e; }
  .pip .pg{ animation:beat 1.1s infinite; }

  /* theme swatch badge on the middle-right frame edge (mirrors the in-app feature) */
  /* anchored to the MODEL-chip row (fixed offset = headers + art window), not the card centre */
  .tswatch{ position:absolute; top:156px; right:-1px; height:30px; display:flex; align-items:center; z-index:3; }
  .tswatch span{ width:19px; height:19px; border-radius:6px; display:flex; align-items:center; justify-content:center;
    font-size:11px; background:#0a140e; border:1px solid color-mix(in srgb,var(--tc) 55%, #0000);
    color:var(--tc); box-shadow:0 0 10px -3px var(--tc); }

  .empty{ color:var(--dim2); text-align:center; padding:46px 0; font-size:12px; }

  .foot{ display:flex; gap:14px; align-items:center; font-size:10.5px; color:var(--dim2);
    padding-top:9px; margin-top:5px; border-top:1px solid var(--line); position:relative; z-index:4; flex-wrap:wrap; }
  .foot a{ color:var(--phos-d); text-decoration:none; } .foot a:hover{ color:var(--phos); }
  .foot .right{ margin-left:auto; display:flex; gap:14px; }

  /* ===== bottom control dock ===== */
  .dock{ display:flex; align-items:center; gap:18px; padding:12px 12px 4px; position:relative; }
  .plate{ font-weight:800; letter-spacing:.14em; font-size:12px; color:#bfe9d2; text-shadow:0 1px 0 #0008; }
  .plate small{ display:block; font-weight:600; font-size:8.5px; letter-spacing:.26em; color:#5f8f76cc; margin-top:1px; }
  .led{ width:9px;height:9px;border-radius:50%; background:var(--phos); box-shadow:0 0 9px var(--phos),0 0 2px #fff inset; animation:beat 1.7s infinite; }
  .ledlab{ font-size:9px; letter-spacing:.2em; color:var(--dim); }
  .knobs{ margin-left:auto; display:flex; gap:20px; align-items:flex-start; }
  .knob-wrap{ display:flex; flex-direction:column; align-items:center; gap:3px; }
  .knob{ width:44px;height:44px;border-radius:50%; position:relative; cursor:ns-resize; touch-action:none;
    background:radial-gradient(circle at 38% 32%, #cfe9d6, #5f8f76 46%, #1c2c24 100%);
    box-shadow:0 4px 8px #000a, 0 0 0 4px #161e1b, 0 0 0 6px #0006, inset 0 -3px 6px #00000066, inset 0 2px 3px #ffffff55; }
  .knob::after{ content:""; position:absolute; left:50%; top:6px; width:3.5px; height:13px; margin-left:-1.75px;
    border-radius:2px; background:linear-gradient(#0d1512,#040806); box-shadow:0 0 2px #000; }
  .knob-label{ font-size:9px; letter-spacing:.13em; color:#bfe9d2; font-weight:700; }
  .knob-val{ font-size:8.5px; color:var(--phos-d); height:10px; }
  .stand{ position:relative; width:34%; max-width:240px; height:18px; margin:0 auto;
    background:linear-gradient(#161e1b,#0a1012); border-radius:0 0 10px 10px; box-shadow:0 14px 22px -8px #000a; }
  .stand::after{ content:""; position:absolute; left:50%; bottom:-9px; transform:translateX(-50%);
    width:48%; height:10px; border-radius:0 0 8px 8px; background:linear-gradient(#11181a,#070c0d); box-shadow:0 8px 14px #0009; }

  @media (max-width:760px){
    body{ padding:12px 10px 22px; }
    .screen{ height:auto; min-height:62vh; padding:13px 12px; }
    .cardgrid{ grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }

<script>

/* ---- what the robot is holding -----------------------------------------
   The wall in the app shows a pane's logo following the tool its agent is
   actually holding: the playhouse robot, animated, wearing that tool's face,
   with the VERB lettered on the glass — "at the console", never `Bash`. This
   is that, on the web, off the same table (assets/robots/tool-faces.js,
   published from app/assets), so the two walls cannot disagree about what
   any tool looks like.

   Each agent works a plausible little run of real tools rather than one
   abstract gerund, because an agent investigating a WebGL question reaches
   for different things than one bumping dependencies, and the robot showing
   that is the entire point. The verb is used BOTH on the glass and as the
   live-action word in the recap, so there is one string and no way for the
   picture and the sentence to describe different activities. */
const DEFAULT_RUN = ['Read', 'Edit', 'Bash', 'Grep'];
/* The Codex panes hold lowercase tools because that is what a Codex rollout
   actually names — `exec`, `grep` — and the table carries rows for them. This
   is the one place Codex is NOT the poor relation: `tail_tool_events` reads
   both the Claude `tool_use` shape and the Codex `function_call` shape, so a
   Codex pane wears a face in the app exactly like any other. It is only the
   VITALS it cannot have, because token accounting is where the two rollout
   schemas genuinely diverge. Two different subsystems, two different answers,
   and the wall should show both honestly rather than blanking Codex twice. */
const TOOL_RUNS = {
  'render-hotpath': ['exec', 'grep'],
  'agents-kiosk':   ['Edit', 'Write', 'Bash', 'Read'],
  'i18n-coverage':  ['Grep', 'Edit', 'Bash'],
  'crt-webgl':      ['WebSearch', 'WebFetch', 'Read', 'Grep'],
  'focus-reader':   ['Read', 'Edit', 'Bash'],
  'cold-start':     ['Bash', 'Read', 'ctx_search'],
  'auth-tests':     ['Write', 'Bash', 'AskUserQuestion'],
  'upload-retry':   ['exec', 'grep'],
  'flaky-ci':       ['Bash', 'Grep', 'TodoWrite'],
  'checkout-flow':  ['Read', 'Edit', 'ctx_patch'],
  'api-v2-docs':    ['Read', 'Write', 'Skill'],
  'onboarding':     ['exec'],
  'feature-bench':  ['Bash', 'Monitor', 'Read'],
  'eval-harness':   ['ctx_compose', 'Read', 'AskUserQuestion'],
  'dep-bump':       ['Bash', 'Edit', 'Glob'],
  'static-gen':     ['grep', 'exec'],
};

/* A tool every five ticks, not every one. The robot's gesture loop is 1.24s;
   swapping the scene each second would mean nobody ever sees him finish
   reaching for anything. */
const TOOL_TICKS = 5;

function toolOf(a) {
  const run = TOOL_RUNS[a.tab] || DEFAULT_RUN;
  return run[(Math.floor(toolPhase / TOOL_TICKS) + a._id) % run.length];
}
/* null when the table has not loaded — the card then keeps the project art it
   has always had, rather than rendering an empty frame. */
function faceOf(a) {
  const F = window.TD_FACES;
  if (!F || a.state !== 'working') return null;
  const t = toolOf(a);
  const row = F.tools[t];
  if (!row) return null;
  return { tool: t, art: row.art || F.fallback, verb: row.verb, tint: row.tint, face: row.face };
}
/* "at the console" on the glass; "At the console…" opening the recap. */
const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);

// ---- the fleet: a FICTIONAL snapshot — staged demo data only (no real prompts/paths).
// The terminal-delight rows reference its own already-public, shipped features.
// state: working|idle|blocked|error|done|shell · eff 0..1 · sess Σ · kind claude|codex|shell
let A = [
  {g:'terminal-delight', tab:'render-hotpath', kind:'codex',  model:'gpt-5.5', eff:.85, state:'working', prompt:'Hoisting the grade coefficients out of the per-cell styled_lines loop', t:24, tok:126,  sess:2200},
  {g:'terminal-delight', tab:'agents-kiosk',   kind:'claude', model:'opus-4.8', eff:.85, state:'working', prompt:'Rebuilding the live agent-wall kiosk as themed cards with real portrait art', t:11, tok:393,  sess:773, ctx:62, fat:30, rel:71},

  {g:'storefront-web', tab:'checkout-flow', kind:'claude', model:'opus-4.8', eff:.85, state:'working', prompt:'Refactoring the checkout flow into smaller, testable components', t:47, tok:690, sess:2400, ctx:78, fat:52, rel:41},
  {g:'storefront-web', tab:'api-v2-docs',   kind:'claude', model:'opus-4.8', eff:.85, state:'done',    prompt:'Draft the API reference for the v2 endpoints', t:0, tok:0, sess:3000, ctx:35, fat:15, rel:77},
  {g:'storefront-web', tab:'onboarding',    kind:'codex',  model:'gpt-5.5', eff:.55, state:'idle',    prompt:'Polish the first-run onboarding copy', t:0, tok:0, sess:0},

  {g:'ml-pipeline', tab:'feature-bench', kind:'claude', model:'sonnet-4.6', eff:.55, state:'working', prompt:'Benchmarking the feature-extraction stage on large batches', t:19, tok:540, sess:1100, ctx:49, fat:26, rel:63},
  {g:'ml-pipeline', tab:'eval-harness',  kind:'claude', model:'opus-4.8', eff:.85, state:'blocked', prompt:'Wire the eval harness to the new scorer — confirm the rubric before I run it', t:0, tok:0, sess:5200, ctx:91, fat:44, rel:81},

  {g:'workstation', tab:'build-watch', kind:'shell', model:null, eff:0, state:'shell', prompt:'cargo watch -x build', t:0, tok:0, sess:0},
  {g:'workstation', tab:'dev-shell',   kind:'shell', model:null, eff:0, state:'shell', prompt:'~/code', t:0, tok:0, sess:0},
];
A.forEach((a,i)=>a._id=i);

const STATE = { working:{glyph:'▶'}, idle:{glyph:'○'}, blocked:{glyph:'‖'}, error:{glyph:'✕'}, done:{glyph:'✓'}, shell:{glyph:'·'} };
const effWord = e => e>=.95?'max':e>=.8?'high':e>=.5?'medium':e>0?'low':'';

/* ---- vitals -------------------------------------------------------------
   The app reads three numbers out of each agent's own transcript and turns
   them into one call. This mirrors the ladder in scripts/td-agent-vitals.mjs
   so the page cannot drift into telling a story the tool would not tell.

   The pair that earns the space is CTX WINDOW × RELEVANCE. A window that is
   full of ballast and one that is full of load-bearing detail look identical
   on a token counter, and they want opposite things: the first compacts for
   free, the second must be handed off, because compaction would throw away
   what is still in use.

   Two rules of the real thing are kept exactly. Colour means direction and
   length means number — so a bar is white while nothing is wrong and only
   takes a colour at the threshold the verdict turns on, which is what stops
   a calm-looking bar sitting next to a chip that says STOP. And RELEVANCE
   diverges: high relevance is the good case on a roomy window and the alarming
   one on a full window, so its ramp follows the call rather than the number.

   Left out, deliberately: the two rules that need real token accounting —
   ballast measured in absolute tokens, and turns-of-headroom. Inventing those
   from staged data would be inventing evidence. -------------------------- */
function verdict(a){
  if (a.ctx == null) return null;
  const fill = a.ctx, r = a.rel, f = a.fat;
  if (f >= 70)               return {call:'STOP',     tone:'bad',  why:'fatigue '+f+' — a fresh session on the same task starts cleaner than this one continues.'};
  if (fill >= 85 && r >= 65) return {call:'HAND OFF', tone:'bad',  why:fill+'% full and '+r+'% of it load-bearing. Compaction here throws away detail still in use.'};
  if (fill >= 85)            return {call:'COMPACT',  tone:'warn', why:fill+'% full, most of it ballast. Compaction is cheap right now.'};
  if (fill >= 60 && r < 45)  return {call:'COMPACT',  tone:'warn', why:'only '+r+'% of the window still serves the task — the rest is re-read every turn for nothing.'};
  if (fill >= 60 || f >= 45) return {call:'WATCH',    tone:'warn', why:fill+'% full, fatigue '+f+'. Nothing wrong yet.'};
  return {call:'RUN', tone:'ok', why:fill+'% full, '+r+'% relevant, room to spare.'};
}

/* A bar is neutral until it crosses the line the call turns on. */
function ctxTone(v){ return v>=85?'bad':v>=60?'warn':'ok'; }
function fatTone(v){ return v>=70?'bad':v>=45?'warn':'ok'; }
function relTone(v, call){ return call==='HAND OFF'?'bad':(v<45?'warn':'ok'); }

function vbar(lab, val, tone){
  return `<div class="vrow t-${tone}"><span class="vlab">${lab}</span>`
       + `<span class="vbar"><i style="width:${Math.max(0,Math.min(100,val))}%"></i></span>`
       + `<span class="vnum">${val}%</span></div>`;
}
function vitalsHTML(a){
  const v = verdict(a);
  /* Codex panes draw no bars — #279. `total_token_usage` would reach CTX
     WINDOW, but FATIGUE and RELEVANCE have no honest definition against a
     rollout schema this different, and a plausible invented number is worse
     than a blank. */
  if (!v) return a.kind==='codex'
    ? `<div class="vitals none">no vitals — codex rollout schema <span class="vq" title="Reachable for CTX WINDOW; FATIGUE and RELEVANCE are not defined for it yet.">?</span></div>`
    : '';
  return `<div class="vitals">`
    + vbar('CTX WINDOW', a.ctx, ctxTone(a.ctx))
    + vbar('FATIGUE',    a.fat, fatTone(a.fat))
    + vbar('RELEVANCE',  a.rel, relTone(a.rel, v.call))
    + `</div>`;
}

function tick(){
  for(const a of A){ if(a.state==='working'){ a.t+=1; a.tok+=Math.round(20+Math.random()*180); a.sess+=Math.round(8+Math.random()*40); } }
  toolPhase=(toolPhase+1)%(TOOL_TICKS*12);

}
function churn(){
  const live=A.filter(a=>a.state!=='shell'), working=live.filter(a=>a.state==='working');
  if(working.length<5){ const cand=live.filter(a=>a.state!=='working'); const a=cand[Math.floor(Math.random()*cand.length)];
    if(a){ a.state='working'; a.t=0; a.tok=Math.round(40+Math.random()*120); } }
  else { const a=working[Math.floor(Math.random()*working.length)]; const r=Math.random();
    a.sess+=a.tok; a.tok=0; a.t=0; a.state=r<0.55?'done':r<0.82?'blocked':'idle'; }
  render(); if(openId!=null) refreshModal();
}

const K={glow:0.62,scan:0.5};
function bindKnob(el,vEl,name,apply){
  const set=v=>{ K[name]=Math.max(0,Math.min(1,v)); el.style.transform='rotate('+(K[name]*270-135)+'deg)';
    if(vEl)vEl.textContent=Math.round(K[name]*100)+'%'; apply(K[name]); };
  set(K[name]); let drag=false,sy,sv;
  el.addEventListener('pointerdown',e=>{drag=true;sy=e.clientY;sv=K[name];el.setPointerCapture(e.pointerId);e.preventDefault();});
  el.addEventListener('pointermove',e=>{if(drag)set(sv+(sy-e.clientY)/150);});
  el.addEventListener('pointerup',()=>drag=false); el.addEventListener('pointercancel',()=>drag=false);
  el.addEventListener('wheel',e=>{e.preventDefault();set(K[name]-Math.sign(e.deltaY)*0.06);},{passive:false});
}

// Claude Code look: ❯ prompt · ● bullets · Tool(args) + ⎿ result · ✻ Cogitating · 1/2/3 perms.
function claudeTx(a,s){
  const L=[], bul=t=>`<span class="t-b">●</span> <span class="t-a">${esc(t)}</span>`,
    tl=(t,arg)=>`<span class="t-b">●</span> <span class="t-tool">${t}</span>(<span class="t-arg">${esc(arg)}</span>)`,
    rs=r=>`<span class="t-r">  ⎿ ${esc(r)}</span>`;
  L.push(`<span class="t-h">❯</span> <span class="t-hp">${esc(a.prompt)}</span>`,'');
  L.push(bul(`I'll start in ${s.dir}/ and work through it.`));
  L.push(tl('Read',s.read), rs(`Read ${120+(a._id*37)%360} lines`));
  L.push(tl('Search',`pattern: "${esc(a.tab.split(/[-·]/)[0])}", path: "${s.dir}"`), rs(`Found ${2+a._id%7} matches`));
  if(a.state==='working'){
    L.push(tl('Edit',s.edit), rs(`Updated with ${2+a._id%5} additions and ${a._id%4} removals`),'');
    L.push(`<span class="t-s">✻ ${esc(cap((faceOf(a)||{}).verb || 'working'))}… (${mmss(a.t)} · ↓ ${ktok(a.tok)} tokens · esc to interrupt)</span> ${CUR}`);
  } else if(a.state==='blocked'){
    L.push(bul(`I've drafted the change — this needs your review before I apply it:`), tl('Edit',s.edit),'');
    L.push(`<span class="t-a">Do you want to make this edit to <b>${esc(s.edit)}</b>?</span>`,`<span class="t-optc">❯ 1.</span> <span class="t-opt">Yes</span>`,`  <span class="t-opt">2. Yes, and don't ask again this session</span>`,`  <span class="t-opt">3. No, tell Claude what to do differently</span>`,'');
    L.push(`<span class="t-blk">⏸ blocked — waiting for your response</span> ${CUR}`);
  } else if(a.state==='error'){
    L.push(tl('Bash',s.test),'',`<span class="t-err">✗ API Error (429): rate_limit_exceeded — too many requests.</span>`,`<span class="t-mut">  Retrying in 38s… (attempt 2/5)</span> ${CUR}`);
  } else if(a.state==='done'){
    L.push(tl('Edit',s.edit), rs(`+${6+a._id%30} −${a._id%9}`), tl('Bash',s.test), rs(`${8+a._id%20} passed; 0 failed`));
    L.push(bul(`Done — ${a.prompt.charAt(0).toLowerCase()+a.prompt.slice(1)}. All green.`),'',`<span class="t-done">✓ Done · Σ${ktok(a.sess)} tokens · ${4+a._id%9} tool uses</span>`,`<span class="t-h">${s.sh} ${s.p} $</span> ${CUR}`);
  } else { L.push('',`<span class="t-mut">(queued — no turn running yet)</span>`,`<span class="t-h">${s.sh} ${s.p} $</span> ${CUR}`); }
  return L.join('\n');
}
// Codex CLI look: › turn · • thought · $ exec + → result · • Working · y/a/n approval · cyan.
function codexTx(a,s){
  const L=[], exec=(cmd,out)=>`<span class="t-cx">$</span> <span class="t-cmd">${esc(cmd)}</span>\n<span class="t-r">  → ${esc(out)}</span>`;
  L.push(`<span class="t-cx">›</span> <span class="t-hp">${esc(a.prompt)}</span>`,'');
  L.push(`<span class="t-mut">• thought for ${1+a._id%4}s</span>`);
  L.push(exec(`grep -rn "${esc(a.tab.split(/[-·]/)[0])}" ${s.dir}`, `${2+a._id%7} matches · ${1+a._id%3} files`));
  L.push(exec(`sed -n '1,40p' ${s.read}`, `read ${40+(a._id*13)%120} lines`));
  if(a.state==='working'){
    L.push(exec(`apply_patch ${s.edit}`, `patched ${s.edit}`),'');
    L.push(`<span class="t-cx">• Working</span> <span class="t-mut">(${mmss(a.t)} · ↓ ${ktok(a.tok)} tokens · esc to interrupt)</span> ${CUR}`);
  } else if(a.state==='blocked'){
    L.push(`<span class="t-a">Allow Codex to run <b>${esc(s.test)}</b>?</span>`,`<span class="t-cxc">› y</span> <span class="t-opt">yes (once)</span>`,`  <span class="t-opt">a  yes, and don't ask again this session</span>`,`  <span class="t-opt">n  no, tell Codex what to change</span>`,'');
    L.push(`<span class="t-blk">⏸ waiting for approval</span> ${CUR}`);
  } else if(a.state==='error'){
    L.push(exec(s.test,'…'),'',`<span class="t-err">✗ stream error: 429 rate_limit_exceeded</span>`,`<span class="t-mut">  retrying (2/5)…</span> ${CUR}`);
  } else if(a.state==='done'){
    L.push(exec(`apply_patch ${s.edit}`, `+${6+a._id%30} −${a._id%9}`), exec(s.test, `${8+a._id%20} passed; 0 failed`));
    L.push(`<span class="t-cx">•</span> <span class="t-a">Done — ${esc(a.prompt.charAt(0).toLowerCase()+a.prompt.slice(1))}.</span>`,'',`<span class="t-done" style="color:var(--cyan)">✓ completed · Σ${ktok(a.sess)} tokens</span>`,`<span class="t-cx">${s.sh}:~$</span> ${CUR}`);
  } else { L.push('',`<span class="t-mut">(idle — no task running)</span>`,`<span class="t-cx">${s.sh}:~$</span> ${CUR}`); }
  return L.join('\n');
}

    + `<div class="sv-stat"><div class="v w">$${usd}</div><div class="l">USD saved</div></div></div>`
    + `<div class="sv-secn">across 188 agents (per-agent = estimated):</div>`
    + rows.map(r=>`<div class="sv-row"><span class="id">${r.id}</span><span class="kk">${r.kind}</span><span class="ca">${r.calls} calls</span><span class="s2">≈ ${svm(r.saved)}</span></div>`).join('')
    + `<div class="sv-secn">top files by compression:</div>`
    + files.map(f=>`<div class="sv-file"><span class="fn">${f[0]}</span><span class="fm">${svm(f[1])}</span><span class="fp">${f[2]}%</span></div>`).join('')
    + `<div class="sv-foot">context saved by <a href="https://leanctx.com/" target="_blank" rel="noopener">lean-ctx</a> (compression on lean-ctx-touched traffic), valued at Opus 4.x input pricing ($5/M) — notional, not your full provider bill · per-agent = estimated until lean-ctx stamps <code>agent_id</code> into the savings ledger.<br>esc or click outside to close · <a href="https://leanctx.com/" target="_blank" rel="noopener">leanctx.com →</a></div>`;
}
// ---- the Σ usage face — every AI coding subscription and how close it is to its ceiling ----
// Mirrors the in-app panel (app/src/usage.rs + Workspace::render_usage_body) on the same
// fictional afternoon TD_USAGE_DEMO stages, so both faces of the card tell one story.
const USAGE=[
  { id:'claude', name:'Claude Code', tier:'Max 20x', prompts:true,
    limits:[ {label:'Session (5-hour)', pct:0.41, resets:'resets in 2h 51m'},
             {label:'Weekly (7-day)',   pct:0.88, resets:'resets Thu'} ],
    today:{tokens:96.4e6, prompts:412, sessions:9},
    days:[['2026-06-16',41.2e6],['2026-06-17',78.9e6],['2026-06-18',12.4e6],['2026-06-19',64.1e6],
          ['2026-06-20',103.8e6],['2026-06-21',22.7e6],['2026-06-22',96.4e6]],
    models:[['claude-opus-5',9.1e3,1.94e6,402.1e6,11.3e6],['claude-sonnet-5',2.4e3,310e3,61.8e6,2.1e6]],
    totals:{prompts:3180, sessions:44, activeDays:21} },
  { id:'codex', name:'Codex', tier:'Plus', prompts:true,
    status:'Codex limits unavailable', help:'Sign in with `codex login` to read the plan’s windows.',
    limits:[], today:{tokens:3.91e6, prompts:38, sessions:2},
    days:[['2026-06-20',1.1e6],['2026-06-21',640e3],['2026-06-22',3.91e6]],
    models:[['gpt-5.6-sol',118e3,21.4e3,2.94e6,0]],
    totals:{prompts:96, sessions:11, activeDays:6} },
  { id:'fireworks', name:'Fireworks', tier:'Prepaid', prompts:false,
    limits:[], balance:{remaining:6.40, funded:20.00, spent:13.60, currency:'USD', estimated:true},
    today:{tokens:1.24e6},
    days:[['2026-06-21',810e3],['2026-06-22',1.24e6]],
    models:[['kimi-k2-instruct',640e3,92e3,0,0]] },
];
let usPick=0;
// A gauge is read before it is understood, so this ramp is deliberately NOT themed:
// green under two thirds, amber past it, red in the last sixth. A palette that made
// 90% of a weekly limit look calm would be a prettier lie than TD is willing to tell.
function pressure(f){ return f>=0.85?'var(--st-red)':f>=0.66?'var(--amber)':'var(--phos)'; }
function meter(frac,col,h){ const f=Math.max(0,Math.min(1,frac));
  // a non-zero share never renders as an empty track: the difference between "barely
  // used" and "not reporting" is the whole reason to look at the row.
  const w=f>0?Math.max(f*100,1.5):0;
  return `<div class="meter" style="height:${h}px"><i style="width:${w}%;background:${col}"></i></div>`; }
function wd(d){ return ['SUN','MON','TUE','WED','THU','FRI','SAT'][new Date(d+'T00:00:00Z').getUTCDay()]; }
function buildUsage(){
  const r=USAGE[usPick];
  let b='';
  b += `<div class="us-subs">` + USAGE.map((u,i)=>
        `<span class="us-sub${i===usPick?' on':''}" data-us="${i}"><b>${esc(u.name)}</b> <span class="tier">${esc(u.tier)}</span></span>`
      ).join('') + `</div>`;
  if(r.status) b += `<div class="us-note">${esc(r.status)}<span class="help">${esc(r.help||'')}</span></div>`;
  r.limits.forEach(l=>{ const c=pressure(l.pct);
    b += `<div class="us-lim"><div class="lh"><span class="lab">${esc(l.label)}</span>`
       + `<span class="rs">${esc(l.resets||'')}</span>`
       + `<span class="pc" style="color:${c}">${Math.round(l.pct*100)}%</span></div>`
       + meter(l.pct,c,7) + `</div>`; });
  if(r.balance){ const bal=r.balance, used=bal.spent/bal.funded, c=pressure(used);
    // the gauge DRAINS, so the pressure ramp reads the SPENT share, not what is left
    b += `<div class="us-lim"><div class="lh"><span class="lab">Credit remaining</span>`
       + `<span class="rs">${bal.estimated?'estimated — funding minus spend':''}</span>`
       + `<span class="pc" style="color:${c}">${bal.currency} ${bal.remaining.toFixed(2)}</span></div>`
       + meter(1-used,c,7)
       + `<div class="us-day" style="margin-top:6px"><span class="wd"></span><span class="bar" style="background:none"></span>`
       + `<span class="tk" style="width:auto">${bal.currency} ${bal.spent.toFixed(2)} of ${bal.funded.toFixed(2)} spent</span></div></div>`; }
  const t=r.today;
  b += `<div class="us-today"><span class="l">TODAY</span><span class="v">`
     + (r.prompts ? `${svm(t.tokens)} tokens &nbsp;·&nbsp; ${t.prompts} prompts &nbsp;·&nbsp; ${t.sessions} sessions`
                  : `${svm(t.tokens)} tokens`)
     + `</span></div>`;
  const peak=Math.max(...r.days.map(d=>d[1]));
  b += `<div class="sv-secn">LAST ${r.days.length} DAYS:</div>`
     + r.days.map((d,i)=>`<div class="us-day${i===r.days.length-1?' now':''}"><span class="wd">${wd(d[0])}</span>`
       + `<span class="bar"><i style="width:${Math.max(d[1]/peak*100,1.5)}%"></i></span>`
       + `<span class="tk">${svm(d[1])}</span></div>`).join('');
  b += `<div class="sv-secn">BY MODEL:</div>`
     + r.models.map(m=>{ const tot=m[1]+m[2]+m[3]+m[4];
         return `<div class="us-model"><span class="m">${esc(m[0])}</span>`
           + `<span class="sp">in ${svm(m[1])} · out ${svm(m[2])} · cache ${svm(m[3]+m[4])}</span>`
           + `<span class="tt">${svm(tot)}</span></div>`; }).join('');
  const prov=['collected 6m ago'].concat(r.totals
    ? [`${r.totals.prompts.toLocaleString()} prompts over ${r.totals.sessions} sessions, ${r.totals.activeDays} active days`] : []).join(' &nbsp;·&nbsp; ');
  svpanel.innerHTML =
      `<div class="sv-h"><div class="sv-logo"><span class="lb">&Sigma;</span> agent <span class="lc">usage</span> <span class="sub2">subscriptions &amp; ceilings</span></div>`
    + `<span class="sv-badge">${USAGE.length} subscriptions</span>` + cardTabs('usage') + `</div>`
    + b
    + `<div class="sv-foot">${prov}<br>`
    + `<b>TD collects none of this.</b> Each subscription arrives as one JSON record written by a per-vendor `
    + `<em>collector</em> — Claude Code's transcripts plus Anthropic's OAuth usage endpoint, Codex's app-server RPC, `
    + `Fireworks' billing API — and this panel just reads the directory. Publish a record under a new <code>id</code> `
    + `and the panel gains a tab; no patch. On Omarchy the <code>omarchy-agent-usage-*</code> collectors already `
    + `publish that record for the agents widget, so TD picks it up for free; on any other Linux the agent-usage `
    + `plugin writes it. Two directories are searched and the newer <code>updatedAt</code> wins, so a box that `
    + `later installs Omarchy never ends up with two stale halves of the same answer.<br>`
    + `esc or click outside to close</div>`;
  // through openCard, so the face tabs get rebound along with the subscription chips
  svpanel.querySelectorAll('.us-sub').forEach(el=>{ el.onclick=()=>{ usPick=+el.dataset.us; openCard('usage'); }; });
}
function cardTabs(face){
  return `<div class="sv-tabs"><span class="sv-tab${face==='savings'?' on':''}" data-face="savings">savings</span>`
       + `<span class="sv-tab${face==='usage'?' on':''}" data-face="usage">usage</span></div>`;
}
function openCard(face){
  face==='usage' ? buildUsage() : buildSavings();
  svpanel.querySelectorAll('.sv-tab').forEach(el=>{ el.onclick=()=>openCard(el.dataset.face); });
  svmodal.classList.add('open');
}
function openSavings(){ openCard('savings'); }
function closeSavings(){ svmodal.classList.remove('open'); }
svmodal.addEventListener('click', e=>{ if(e.target===svmodal) closeSavings(); });

addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeModal(); closeSavings(); } });

render();
setInterval(tick,1000); setInterval(churn,5000);
window.__ready=true;
</script></body></html>
